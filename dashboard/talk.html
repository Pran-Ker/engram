<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to the avatar</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--line:#d9d3c7;--ink:#1c1b19;--muted:#6b675f;--accent:#0b5cad;--ok:#1e7f4f;--warn:#9a6700;--bad:#a61b1b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top a{color:var(--accent);text-decoration:none;font-size:14px}
.top a:hover{text-decoration:underline}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.who{color:var(--muted);font-size:14px;margin:2px 0 0}
.main{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.avatar{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.face{position:relative;aspect-ratio:1;background:#e7e1d4;overflow:hidden}
.face img,.face video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face img{animation:breathe 6s ease-in-out infinite;transform-origin:50% 40%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.face video{opacity:0;transition:opacity .35s}
.face.talking video{opacity:1}
.face .initials{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;color:var(--muted)}
.face.intro video#clip{opacity:1}
.face video#reply{opacity:0;z-index:2}
.face.reply video#reply{opacity:1}
.face.reply video#clip{opacity:0}
.face.rendering::after{content:"";position:absolute;right:12px;top:12px;width:22px;height:22px;border:3px solid rgba(255,255,255,.55);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;z-index:3;filter:drop-shadow(0 0 2px rgba(0,0,0,.4))}
@keyframes spin{to{transform:rotate(360deg)}}
.pill.rendering{color:var(--warn);border-color:var(--warn)}
.opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px 0;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.face .play{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(28,27,25,.82);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px)}
.face .play:hover{background:rgba(28,27,25,.95)}
.state{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.speaking{color:var(--ok);border-color:var(--ok)}
.pill.thinking{color:var(--warn);border-color:var(--warn)}
.pill.listening{color:var(--accent);border-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chat{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:420px;max-height:70vh}
.log{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:15px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.them .s{transition:color .2s}
.msg.them .s.now{color:var(--accent);font-weight:600}
.msg.them .draft{color:var(--muted)}
.msg.note{align-self:center;background:transparent;color:var(--muted);font-size:13px}
.msg.err{align-self:stretch;background:#fbeaea;color:var(--bad);font-size:14px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input[type=text]{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.ghost.on{background:var(--accent);color:#fff}
.foot{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.face img{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="name">…</h1><p class="who" id="who"></p></div>
    <a href="/">← All avatars</a>
  </div>
  <div class="main">
    <div class="avatar">
      <div class="face" id="face"><span class="initials" id="initials"></span><img id="photo" alt="" hidden><video id="clip" muted loop playsinline preload="auto"></video><video id="reply" playsinline preload="auto"></video></div>
      <div class="state"><span class="pill" id="state"><span class="dot"></span><span id="stateText">ready</span></span><span id="voice">voice: …</span></div>
    </div>
    <div class="chat">
      <div class="log" id="log"><div class="msg note">Answers come from the research on their card. Ask anything about them or their company.</div></div>
      <div class="opts"><label><input type="checkbox" id="videoReply" checked> Spoken video replies — FLUX 3 renders the avatar saying the answer (<b id="replyCost">~$0.6–1.0</b>, 1–2 min); off = instant browser voice</label></div>
      <form id="f"><input type="text" id="q" placeholder="Say something…" autocomplete="off"><button type="button" class="ghost" id="mic" hidden title="Speak your question">🎙</button><button type="submit" id="send">Send</button></form>
    </div>
  </div>
  <div class="foot"><span>Brain: Liquid LFM2.5 via Engram direct mode</span><span>Spoken replies: FLUX 3 video with native voice</span><span id="footVoice"></span><a id="stage" href="#" target="_blank">Open on the Engram stage ↗</a></div>
</div>

<script>
const $ = id => document.getElementById(id);
const pid = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
const uid = () => Math.random().toString(36).slice(2, 10);
const sessionId = uid();
let cfg, person, history = [], engramTtsOk = true, queue = Promise.resolve(), speakingCount = 0;

function setState(s) { $('state').className = 'pill ' + s; $('stateText').textContent = s; }
let quietTimer;
function talking(on) {  // the muted clip plays while anything is being spoken; a short grace period hides the gap between sentences
  speakingCount = Math.max(0, speakingCount + (on ? 1 : -1)); clearTimeout(quietTimer);
  const apply = () => { const t = speakingCount > 0; $('face').classList.toggle('talking', t); if (t) $('clip').play().catch(() => {}); else $('clip').pause(); setState(t ? 'speaking' : 'ready'); };
  if (speakingCount > 0) apply(); else quietTimer = setTimeout(apply, 450);
}

// The "bring to life" clip is the person's own intro: play it with sound as the first message, then keep the clip muted for answers.
async function intro() {
  if (!person.avatar_speech) return;
  add('them', esc(person.avatar_speech)); history.push({ role: 'assistant', content: person.avatar_speech });
  if (!person.avatar_video) return;
  const clip = $('clip'), face = $('face');
  const finish = () => { face.classList.remove('intro'); clip.muted = true; clip.loop = true; clip.pause(); clip.currentTime = 0; setState('ready'); clip.onended = null; };
  const play = async () => {
    clip.muted = false; clip.loop = false; clip.currentTime = 0; face.classList.add('intro'); setState('speaking'); clip.onended = finish;
    try { await clip.play(); face.querySelector('.play')?.remove(); return true; } catch { face.classList.remove('intro'); setState('ready'); return false; }
  };
  if (!(await play())) {  // no sound before a gesture in a fresh tab: offer a button
    const b = document.createElement('button'); b.type = 'button'; b.className = 'play'; b.textContent = '▶ Hear the intro';
    b.onclick = () => { b.remove(); play(); }; face.appendChild(b);
  }
}
function add(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; $('log').appendChild(d); $('log').scrollTop = 1e9; return d; }
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function init() {
  cfg = await (await fetch('/api/config')).json();
  person = (await (await fetch('/api/people')).json()).find(p => p.person_id === pid);
  if (!person) { $('name').textContent = 'Unknown person'; return; }
  document.title = `Talk to ${person.full_name}`;
  $('name').textContent = person.full_name; $('who').textContent = [person.headline, person.current_company].filter(Boolean).join(' · ');
  $('stage').href = `${cfg.engram_stage}/e/${encodeURIComponent(pid)}`;
  if (person.image) { $('photo').src = '/' + person.image; $('photo').hidden = false; } else $('initials').textContent = person.full_name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  if (person.avatar_video) $('clip').src = '/' + person.avatar_video;
  probeVoice();
  if ('webkitSpeechRecognition' in window) setupMic();
  intro();
}

// Voice: Engram's Liquid-Audio /tts when a voice service is deployed, else the browser's own speech synthesis.
async function probeVoice() {
  try { const r = await fetch(`${cfg.engram_api}/api/engrams/${pid}/tts/health`); const j = await r.json(); engramTtsOk = r.ok && j.ok && !!j.provider; }
  catch { engramTtsOk = false; }
  const label = engramTtsOk ? 'instant voice: Liquid Audio' : 'instant voice: browser speech';
  $('voice').textContent = label; $('footVoice').textContent = engramTtsOk ? 'Instant voice: LFM2.5-Audio via Engram' : 'Instant voice: browser speech synthesis';
}
function speak(text) { queue = queue.then(() => speakOne(text)).catch(() => {}); return queue; }
async function speakOne(text) {
  if (engramTtsOk) {
    try {
      const r = await fetch(`${cfg.engram_api}/api/engrams/${pid}/tts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!r.ok) throw new Error('tts ' + r.status);
      const url = URL.createObjectURL(await r.blob()); const a = new Audio(url);
      talking(true); await new Promise(res => { a.onended = a.onerror = res; a.play().catch(res); }); talking(false); URL.revokeObjectURL(url); return;
    } catch { engramTtsOk = false; $('voice').textContent = 'voice: browser speech'; }
  }
  if (!('speechSynthesis' in window)) return;
  await new Promise(res => {
    const u = new SpeechSynthesisUtterance(text); u.rate = 1; u.pitch = 1;
    const voices = speechSynthesis.getVoices(); u.voice = voices.find(v => /en[-_]US/i.test(v.lang) && /natural|google|premium|enhanced/i.test(v.name)) || voices.find(v => /^en/i.test(v.lang)) || null;
    u.onstart = () => talking(true); u.onend = u.onerror = () => { talking(false); res(); };
    speechSynthesis.speak(u); setTimeout(res, 30000);
  });
}

// FLUX 3 speaks the reply: the brain's text goes to POST /api/reply-clip, the returned clip plays with sound over the avatar.
function stopReply() { const r = $('reply'); r.pause(); r.onended = null; $('face').classList.remove('reply', 'rendering'); }
async function videoReply(text, bubble) {
  $('face').classList.add('rendering'); setState('rendering');
  const note = document.createElement('div'); note.className = 'draft'; note.textContent = 'Rendering the spoken reply with FLUX 3 (1–2 min)…'; bubble.appendChild(note);
  try {
    const post = async () => { const r = await fetch(`/api/reply-clip/${encodeURIComponent(pid)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || `render failed (${r.status})`); return j; };
    let j; try { j = await post(); } catch (e) { if (!/Failed to fetch|NetworkError/.test(e.message)) throw e; await new Promise(res => setTimeout(res, 3000)); j = await post(); }  // one retry on a network blip
    const t0 = Date.now();
    while (j.status === 'rendering') {  // background job on the server: poll, so a hiccup here never loses the render
      note.textContent = `Rendering the spoken reply with FLUX 3 (~$${j.estimate_usd}, ${j.seconds}s clip)… ${Math.round((Date.now() - t0) / 1000)}s`;
      await new Promise(res => setTimeout(res, 3000));
      const r = await fetch(`/api/reply-clip?job=${encodeURIComponent(j.job)}`).catch(() => null);
      if (r && r.ok) j = await r.json();
      if (Date.now() - t0 > 6 * 60 * 1000) throw new Error('render timed out');
    }
    if (j.status !== 'done') throw new Error(j.error || 'render failed');
    note.textContent = `Spoken by FLUX 3 · ${j.seconds}s · ${j.cached ? 'cached' : '~$' + j.estimate_usd}`;
    const v = $('reply'); v.src = '/' + j.url; v.muted = false; v.currentTime = 0;
    $('face').classList.remove('rendering'); $('face').classList.add('reply'); setState('speaking');
    await new Promise(res => { v.onended = v.onerror = res; v.play().catch(res); });
    stopReply(); setState('ready');
  } catch (e) {
    $('face').classList.remove('rendering'); note.textContent = `Video reply unavailable (${e.message}) — spoken by the browser instead.`;
    for (const s of bubble.querySelectorAll('.s')) await speak(s.textContent.trim());
    if (!speakingCount) setState('ready');
  }
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  $('q').value = ''; $('send').disabled = true; speechSynthesis?.cancel?.(); stopReply();
  if ($('face').classList.contains('intro')) { const c = $('clip'); c.onended?.(); }  // a question interrupts the intro
  const useVideo = $('videoReply').checked;
  add('user', esc(text)); history.push({ role: 'user', content: text });
  const bubble = add('them', '<span class="draft">…</span>'); const sentences = []; let draft = ''; let spoken = '';
  setState('thinking');
  try {
    const r = await fetch(`${cfg.engram_api}/api/engrams/${pid}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history.slice(-12), sessionId }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `chat ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        let e; try { e = JSON.parse(line.slice(5)); } catch { continue; }
        if (e.type === 'token') { draft += e.text; render(); }
        if (e.type === 'sentence') { sentences.push(e.text); draft = ''; render(); if (!useVideo) { speak(e.text).then(() => { const el = bubble.querySelector(`[data-i="${e.index}"]`); if (el) el.classList.remove('now'); }); highlightSoon(e.index); } }
        if (e.type === 'done') { spoken = e.text; }
        if (e.type === 'error') add('err', esc(e.message));
      }
    }
  } catch (err) { add('err', esc(err.message.includes('Failed to fetch') ? `Engram API is not reachable at ${cfg.engram_api}.` : err.message)); }
  const answer = spoken || sentences.join(' ');
  if (answer) history.push({ role: 'assistant', content: answer });
  draft = ''; render(); $('send').disabled = false;
  if (useVideo && answer) await videoReply(answer, bubble); else if (!speakingCount) setState('ready');
  function render() { bubble.innerHTML = sentences.map((s, i) => `<span class="s" data-i="${i}">${esc(s)} </span>`).join('') + (draft ? `<span class="draft">${esc(draft)}</span>` : ''); $('log').scrollTop = 1e9; }
  function highlightSoon(i) { queue.then(() => {}); setTimeout(() => { const el = bubble.querySelector(`[data-i="${i}"]`); if (el && speakingCount) el.classList.add('now'); }, 50); }
}

function setupMic() {
  const rec = new webkitSpeechRecognition(); rec.lang = 'en-US'; rec.interimResults = true; let on = false;
  $('mic').hidden = false;
  rec.onresult = e => { const t = [...e.results].map(r => r[0].transcript).join(''); $('q').value = t; if (e.results[e.results.length - 1].isFinal) { stop(); ask(t); } };
  rec.onerror = rec.onend = () => stop();
  const stop = () => { on = false; $('mic').classList.remove('on'); if ($('state').textContent.includes('listening')) setState('ready'); try { rec.stop(); } catch {} };
  $('mic').onclick = () => { if (on) return stop(); on = true; $('mic').classList.add('on'); setState('listening'); rec.start(); };
}

$('f').onsubmit = e => { e.preventDefault(); ask($('q').value); };
if ('speechSynthesis' in window) speechSynthesis.getVoices();
init();
</script>
</body>
</html>
